<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的博客 | 主页</title>

    <!-- 引入Font Awesome图标 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* 全局样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary-color: #4a6ee0;
            --secondary-color: #6c757d;
            --accent-color: #ff6b6b;
            --light-color: #f8f9fa;
            --dark-color: #343a40;
            --border-color: #e9ecef;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s ease;
        }

        body {
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* 导航栏样式 */
        .nav {
            display: flex;
            align-items: center;
            background-color: white;
            padding: 0.8rem 2rem;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav img {
            height: 40px;
            border-radius: 50%;
            margin-right: 12px;
        }

        .blog-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        .space {
            flex-grow: 1;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-span {
            margin-left: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            transition: var(--transition);
            font-weight: 500;
            white-space: nowrap;
        }

        .nav-span:hover {
            background-color: var(--primary-color);
            color: white;
        }

        /* 容器布局 */
        .container {
            display: flex;
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
            gap: 2rem;
        }

        .left {
            flex: 0 0 300px;
        }

        .right {
            flex: 1;
        }

        /* 卡片样式 */
        .card {
            background-color: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            text-align: center;
            margin-bottom: 1.5rem;
            transition: var(--transition);
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
        }

        .card img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 1rem;
            border: 3px solid var(--primary-color);
        }

        .card h3 {
            margin-bottom: 0.5rem;
            color: var(--dark-color);
        }

        .card a {
            display: inline-block;
            color: var(--secondary-color);
            margin-bottom: 1rem;
            transition: var(--transition);
        }

        .card a:hover {
            color: var(--primary-color);
        }

        .row {
            display: flex;
            justify-content: space-around;
            margin-top: 1rem;
        }

        .row span:first-child {
            font-weight: 600;
            color: var(--dark-color);
        }

        .row span:last-child {
            color: var(--primary-color);
            font-weight: 700;
        }

        /* 搜索框样式 */
        .search-box {
            background-color: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            margin-bottom: 1.5rem;
        }

        .search-box input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            transition: var(--transition);
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(74, 110, 224, 0.2);
        }

        /* 分类和标签样式 */
        .categories,
        .tags {
            background-color: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            margin-bottom: 1.5rem;
        }

        .categories h4,
        .tags h4 {
            margin-bottom: 1rem;
            color: var(--dark-color);
            display: flex;
            align-items: center;
        }

        .categories h4 i,
        .tags h4 i {
            margin-right: 0.5rem;
            color: var(--primary-color);
        }

        .category-item {
            display: flex;
            justify-content: space-between;
            padding: 0.7rem 0;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: var(--transition);
        }

        .category-item:hover {
            color: var(--primary-color);
            background-color: rgba(74, 110, 224, 0.05);
            padding-left: 0.5rem;
        }

        .category-item:last-child {
            border-bottom: none;
        }

        .tag-cloud {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .tag {
            background-color: #e9ecef;
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .tag:hover {
            background-color: var(--primary-color);
            color: white;
            transform: translateY(-2px);
        }

        /* 博客列表样式 */
        .blog {
            background-color: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            margin-bottom: 1.5rem;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .blog:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
        }

        .blog::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 5px;
            height: 100%;
            background-color: var(--primary-color);
            transform: scaleY(0);
            transition: var(--transition);
        }

        .blog:hover::before {
            transform: scaleY(1);
        }

        .title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--dark-color);
        }

        .date {
            color: var(--secondary-color);
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .desc {
            margin-bottom: 1.5rem;
            color: #555;
            line-height: 1.7;
        }

        .blog-meta {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            color: var(--secondary-color);
        }

        .blog-meta span {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .blog-meta i {
            color: var(--primary-color);
        }

        .detail {
            display: inline-block;
            color: var(--primary-color);
            font-weight: 600;
            transition: var(--transition);
        }

        .detail:hover {
            color: var(--accent-color);
            transform: translateX(5px);
        }

        /* 分页样式 */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            margin-top: 2rem;
            flex-wrap: wrap;
        }

        .page-btn {
            padding: 0.6rem 1rem;
            border: 1px solid var(--border-color);
            background-color: white;
            border-radius: 6px;
            cursor: pointer;
            transition: var(--transition);
            min-width: 44px;
            text-align: center;
        }

        .page-btn:hover:not(:disabled) {
            background-color: var(--light-color);
        }

        .page-btn.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .page-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .page-info {
            color: var(--secondary-color);
            font-size: 0.9rem;
            margin: 0 1rem;
        }

        /* 加载状态 */
        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--secondary-color);
        }

        .loading-spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid rgba(74, 110, 224, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary-color);
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--secondary-color);
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: var(--border-color);
        }

        /* 响应式设计 */
        @media (max-width: 992px) {
            .container {
                flex-direction: column;
            }

            .left {
                flex: 1;
            }
        }

        @media (max-width: 768px) {
            .nav {
                padding: 0.8rem 1rem;
            }

            .nav-links {
                gap: 0.2rem;
            }

            .nav-span {
                margin-left: 0.3rem;
                padding: 0.4rem 0.8rem;
                font-size: 0.9rem;
            }

            .container {
                padding: 0 0.5rem;
            }

            .blog-meta {
                flex-wrap: wrap;
                gap: 1rem;
            }

            .pagination {
                gap: 0.3rem;
            }

            .page-btn {
                padding: 0.5rem 0.8rem;
                min-width: 40px;
            }
        }

        @media (max-width: 576px) {
            .nav {
                flex-wrap: wrap;
            }

            .nav-links {
                order: 3;
                width: 100%;
                justify-content: center;
                margin-top: 0.5rem;
            }

            .nav-span {
                margin-left: 0.2rem;
                padding: 0.3rem 0.6rem;
                font-size: 0.85rem;
            }

            .pagination {
                flex-direction: column;
                gap: 1rem;
            }

            .page-info {
                margin: 0;
            }
        }
    </style>
</head>

<body>
    <div class="nav">
        <img src="pic/logo2.jpg" alt="博客Logo">
        <span class="blog-title">我的博客</span>
        <div class="space"></div>
        <div class="nav-links">
            <a class="nav-span" href="blog_list.html">主页</a>
            <a class="nav-span" href="blog_edit.html">写博客</a>
            <a class="nav-span" href="blog_profile.html">个人资料</a>
            <a class="nav-span" href="#" onclick="logout()">退出</a>
        </div>
    </div>

    <div class="container">
        <div class="left">
            <!-- 用户信息卡片 -->
            <div class="card">
                <img src="pic/doge.jpg" alt="用户头像">
                <h3>小马</h3>
                <a href="egg.html"><i class="fab fa-github"></i> GitHub 地址</a>
                <div class="row">
                    <span>文章</span>
                    <span>分类</span>
                </div>
                <div class="row">
                    <span id="totalBlogs">999</span>
                    <span id="totalCategories">999</span>
                </div>
            </div>

            <!-- 搜索框 -->
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="搜索博客...">
            </div>

            <!-- 分类列表 -->
            <div class="categories">
                <h4><i class="fas fa-folder"></i> 文章分类</h4>
                <div class="category-item" onclick="filterByCategory('技术')">
                    <span>技术</span>
                    <span>999</span>
                </div>
                <div class="category-item" onclick="filterByCategory('生活')">
                    <span>生活</span>
                    <span>999</span>
                </div>
                <div class="category-item" onclick="filterByCategory('学习')">
                    <span>学习</span>
                    <span>999</span>
                </div>
                <div class="category-item" onclick="filterByCategory('其他')">
                    <span>其他</span>
                    <span>999</span>
                </div>
            </div>

            <!-- 标签云 -->
            <div class="tags">
                <h4><i class="fas fa-tags"></i> 热门标签</h4>
                <div class="tag-cloud">
                    <span class="tag" onclick="filterByTag('JavaScript')">JavaScript</span>
                    <span class="tag" onclick="filterByTag('CSS')">CSS</span>
                    <span class="tag" onclick="filterByTag('HTML')">HTML</span>
                    <span class="tag" onclick="filterByTag('Vue')">Vue</span>
                    <span class="tag" onclick="filterByTag('React')">React</span>
                    <span class="tag" onclick="filterByTag('Node.js')">Node.js</span>
                    <span class="tag" onclick="filterByTag('前端')">前端</span>
                    <span class="tag" onclick="filterByTag('后端')">后端</span>
                </div>
            </div>
        </div>

        <div class="right">
            <!-- 博客列表区域 -->
            <div id="blogList">
                <!-- 博客内容将通过JavaScript动态生成 -->
                <div class="loading"></div>
                <div class="loading-spinner"></div>
                <p>正在加载博客内容...</p>
            </div>


            <!-- 分页 -->
            <div class="pagination" id="pagination">
                <!-- 分页按钮将通过JavaScript动态生成 -->
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script>
        // 全局变量
        let currentPage = 1;
        let totalPages = 1;
        let pageSize = 3; // 每页显示的文章数量
        let currentCategory = '';
        let currentTag = '';
        let currentKeyword = '';

        //loadUserInfo();
        // 页面加载完成后初始化
        $(document).ready(function () {
            // 检查登录状态
            const token = localStorage.getItem('user_token');
            if (!token) {
                alert('请先登录！');
                window.location.href = 'blog_login.html';
                return;
            }


            //加载用户信息卡片
            loadUserInfo();

            // 加载第一页数据
            loadBlogs(currentPage);

            // 绑定搜索事件
            $('#searchInput').on('input', function () {
                currentKeyword = $(this).val().trim();
                // 添加防抖，避免频繁请求
                clearTimeout($(this).data('timeout'));
                $(this).data('timeout', setTimeout(function () {
                    loadBlogs(1);
                }, 500));
            });
        });



        // 加载用户信息
        function loadUserInfo() {
            // 发送AJAX请求获取用户信息
            $.ajax({
                url: '/user/getUserInfo', // 后端API地址
                type: 'POST',
                headers: {
                    'user_token': localStorage.getItem('user_token')
                },
                success: function (response) {
                    if (response.code == 200) {
                        // 更新用户信息卡片
                        updateUserInfoCard(response.data);
                    } else {
                        console.error('加载用户信息失败:', response.message);
                        // 使用默认用户信息
                        setDefaultUserInfo();
                    }
                },
                error: function (xhr, status, error) {
                    console.error('请求用户信息失败:', error);
                    // 使用默认用户信息
                    setDefaultUserInfo();
                }
            });
        }

        //渲染用户信息卡片
        function updateUserInfoCard(userData) {
            const card = $('.card');

            // 构建用户信息HTML
            const userInfoHTML = `
        <img src="${userData.avatar || 'pic/doge.jpg'}" alt="用户头像" 
             onerror="this.src='pic/doge.jpg'">
        <h3>${userData.nickname || '小马'}</h3>
        <a href="${userData.github || 'egg.html'}" target="_blank">
            <i class="fab fa-github"></i> GitHub 地址
        </a>
        <div class="row">
            <span>文章</span>
            <span>分类</span>
        </div>
        <div class="row">
            <span id="totalBlogs">${userData.blogCount || 999}</span>
            <span id="totalCategories">${userData.categoryCount || 999}</span>
        </div>
        ${userData.bio ? `<p style="color: var(--secondary-color); font-size: 0.9rem; margin-top: 0.5rem; font-style: italic;">${userData.bio}</p>` : ''}
    `;

            card.html(userInfoHTML);

            // 更新页面标题中的用户名
            updatePageTitle(userData.nickname);

            console.log('用户信息更新完成:', userData);
        }


        //默认用户信息
        function setDefaultUserInfo() {
            const card = $('.card');
            const defaultUserInfo = `
        <img src="pic/doge.jpg" alt="用户头像">
        <h3>小马</h3>
        <a href="egg.html" target="_blank">
            <i class="fab fa-github"></i> GitHub 地址
        </a>
        <div class="row">
            <span>文章</span>
            <span>分类</span>
        </div>
        <div class="row">
            <span id="totalBlogs">999</span>
            <span id="totalCategories">999</span>
        </div>
    `;
            card.html(defaultUserInfo);
        }


        // 更新页面标题中的用户名
        function updatePageTitle(nickname) {
            if (nickname) {
                const currentTitle = document.title;
                // 如果标题中还没有用户名，就添加
                if (!currentTitle.includes(nickname)) {
                    document.title = `${nickname}的博客 | 我的博客系统`;
                }
            }
        }


        // 加载博客列表
        function loadBlogs(page, category = currentCategory, tag = currentTag) {
            currentPage = page;
            currentCategory = category;
            currentTag = tag;

            // 显示加载状态
            $('#blogList').html(`
            <div class="loading">
                <div class="loading-spinner"></div>
                <p>正在加载博客内容...</p>
            </div>
        `);

            // 构建请求参数
            const params = {
                page: page,
                pageSize: pageSize
            };

            if (currentCategory) {
                params.category = currentCategory;
            }

            if (currentTag) {
                params.tag = currentTag;
            }

            if (currentKeyword) {
                params.keyword = currentKeyword;
            }

            // 发送AJAX请求获取博客列表
            $.ajax({
                url: '/blog/getList', // 后端API地址
                type: 'POST',
                data: {
                    page: params.page,
                    pageSize: params.pageSize
                },
                //data: params,
                headers: {
                    'user_token': localStorage.getItem('user_token')
                },
                success: function (response) {
                    if (response.code == 200) {
                        // 更新博客列表
                        renderBlogs(response.data.blogList);
                        // 更新分页
                        updatePagination(response.data.totalPages, response.data.currentPage);
                        // 更新用户统计数据
                        updateUserStats(response.data.userBlogCount, response.data.categoryCount);
                    } else {
                        showError('加载博客列表失败: ' + response.message);
                    }
                },
                error: function (xhr, status, error) {
                    console.error('请求失败:', error);
                    // 模拟数据（实际项目中应删除）
                }
            });
        }

        // 渲染博客列表
        function renderBlogs(blogs) {
            if (!blogs || blogs.length === 0) {
                $('#blogList').html(`
                <div class="empty-state">
                    <i class="far fa-file-alt"></i>
                    <h3>暂无博客文章</h3>
                    <p>${currentKeyword ? '没有找到相关的博客文章' : '还没有发布任何博客文章'}</p>
                    ${!currentKeyword ? '<a href="blog_edit.html" class="btn btn-primary" style="margin-top: 1rem;">开始写博客</a>' : ''}
                </div>
            `);
                return;
            }

            let blogsHTML = '';
            blogs.forEach(blog => {
                blogsHTML += `
                <div class="blog">
                    <div class="title">${blog.title}</div>
                    <div class="date">${formatDate(blog.createTime)}</div>
                    <div class="desc">${blog.summary}</div>
                    <div class="blog-meta">
                        <span><i class="far fa-eye"></i> ${blog.viewCount || 0}</span>
                        <span><i class="far fa-comment"></i> ${blog.commentCount || 0}</span>
                        <span><i class="far fa-heart"></i> ${blog.likeCount || 0}</span>
                        <span><i class="fas fa-tag"></i> ${blog.categoryId}</span>
                    </div>
                    <a class="detail" href="blog_detail.html?blog_id=${blog.id}">查看全文&gt;&gt;</a>
                </div>
            `;
            });

            $('#blogList').html(blogsHTML);
        }

        // 更新分页组件
        function updatePagination(totalPages_m, currentPage_m) {
            totalPages = totalPages_m;
            currentPage = currentPage_m;

            let paginationHTML = '';

            // 上一页按钮
            paginationHTML += `
            <button class="page-btn" ${currentPage === 1 ? 'disabled' : ''}
                onclick="loadBlogs(${currentPage - 1})">
                上一页
            </button>
        `;

            // 页码按钮
            const maxVisiblePages = 3;
            let startPage = Math.max(1, currentPage - Math.floor(maxVisiblePages / 2));
            let endPage = Math.min(totalPages, startPage + maxVisiblePages - 1);

            // 调整起始页码，确保显示maxVisiblePages个页码
            if (endPage - startPage + 1 < maxVisiblePages) {
                startPage = Math.max(1, endPage - maxVisiblePages + 1);
            }

            // 第一页和省略号
            if (startPage > 1) {
                paginationHTML += `
                <button class="page-btn" onclick="loadBlogs(1)">1</button>
                ${startPage > 2 ? '<span class="page-btn" disabled>...</span>' : ''}
            `;
            }

            // 页码
            for (let i = startPage; i <= endPage; i++) {
                paginationHTML += `
                <button class="page-btn ${i === currentPage ? 'active' : ''}"
                    onclick="loadBlogs(${i})">
                    ${i}
                </button>
            `;
            }

            // 最后一页和省略号
            if (endPage < totalPages) {
                paginationHTML += `
                ${endPage < totalPages - 1 ? '<span class="page-btn" disabled>...</span>' : ''}
                <button class="page-btn" onclick="loadBlogs(${totalPages})">${totalPages}</button>
            `;
            }

            // 下一页按钮
            paginationHTML += `
            <button class="page-btn" ${currentPage === totalPages ? 'disabled' : ''}
                onclick="loadBlogs(${currentPage + 1})">
                下一页
            </button>
        `;

            // 页面信息
            paginationHTML += `
            <div class="page-info">
                第 ${currentPage} 页，共 ${totalPages} 页
            </div>
        `;

            //$('#pagination').html(paginationHTML);

            $('#pagination').html(paginationHTML);
        }

        // 更新用户统计数据
        function updateUserStats(userBlogCount_m, categoryCount_m) {
            userBlogCount = userBlogCount_m;
            categoryCount = categoryCount_m;

            if (userBlogCount > 0) {
                $('#totalBlogs').text(userBlogCount || 0);
            }
            if (categoryCount > 0) {
                $('#totalCategories').text(categoryCount || 0);
            }
        }

        // 分类筛选
        function filterByCategory(category) {
            currentCategory = category;
            currentTag = '';
            currentKeyword = '';
            $('#searchInput').val('');
            loadBlogs(1, category);
        }

        // 标签筛选
        function filterByTag(tag) {
            currentTag = tag;
            currentCategory = '';
            currentKeyword = '';
            $('#searchInput').val('');
            loadBlogs(1, '', tag);
        }

        // 显示错误信息
        function showError(message) {
            $('#blogList').html(`
            <div class="empty-state">
                <i class="fas fa-exclamation-triangle"></i>
                <h3>加载失败</h3>
                <p>${message}</p>
                <button class="btn btn-primary" onclick="loadBlogs(currentPage)" style="margin-top: 1rem;">
                    重新加载
                </button>
            </div>
        `);
        }

        // 格式化日期
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            });
        }

        // 注销功能
        function logout() {
            if (confirm('确定要退出登录吗？')) {
                localStorage.removeItem('user_token');
                localStorage.removeItem('rememberMe');
                localStorage.removeItem('username');
                window.location.href = 'blog_login.html';
            }
        }
    </script>
</body>

</html>
