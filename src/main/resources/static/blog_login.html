<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博客登陆页</title>

<!--    <link rel="stylesheet" href="css/common.css">-->
<!--    <link rel="stylesheet" href="css/login.css">-->

    <style>
        /* 扩展样式，保持原有风格 + 视觉美化 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            /* 优化渐变色彩，更柔和自然 */
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);
            min-height: 100vh;
            /* 背景添加细微噪点，提升质感 */
            background-image: url("/pic/background.jpg");
        }

        .nav {
            display: flex;
            align-items: center;
            padding: 15px 30px;
            /* 毛玻璃效果导航栏 */
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.08);
            position: relative;
            z-index: 100;
        }

        .nav img {
            height: 40px;
            width: auto;
            border-radius: 8px;
            margin-right: 15px;
            /* 轻微阴影提升logo质感 */
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .nav img:hover {
            transform: scale(1.05);
        }

        .blog-title {
            font-size: 22px;
            font-weight: 700;
            color: #2d3748;
            /* 文字渐变 */
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .space {
            flex: 1;
        }

        .nav-span {
            margin-left: 25px;
            text-decoration: none;
            color: #4a5568;
            font-size: 16px;
            padding: 8px 15px;
            border-radius: 8px;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-span:hover {
            background-color: rgba(99, 102, 241, 0.08);
            color: #6366f1;
            /* 底部小下划线动画 */
        }

        .nav-span::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            transition: all 0.3s ease;
            transform: translateX(-50%);
        }

        .nav-span:hover::after {
            width: 80%;
        }

        .container-login {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 80px);
            padding: 30px 20px;
            /* 登录区域添加轻微透视感 */
            perspective: 1000px;
        }

        .login-dialog {
            background-color: white;
            padding: 45px 40px;
            border-radius: 16px;
            /* 更细腻的阴影层次 */
            box-shadow: 0 15px 40px rgba(99, 102, 241, 0.12), 0 5px 15px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 420px;
            animation: fadeIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            /* 轻微3D效果 */
            transform: rotateX(0deg);
            transition: transform 0.3s ease;
        }

        .login-dialog:hover {
            transform: rotateX(2deg) translateY(-2px);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px) rotateX(5deg);
            }

            to {
                opacity: 1;
                transform: translateY(0) rotateX(0deg);
            }
        }

        .login-dialog h3 {
            text-align: center;
            margin-bottom: 35px;
            font-size: 26px;
            color: #2d3748;
            font-weight: 700;
            /* 标题下方装饰线 */
            position: relative;
        }

        .login-dialog h3::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            border-radius: 3px;
        }

        .row {
            margin-bottom: 22px;
        }

        .row span {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #4a5568;
            font-size: 15px;
        }

        .row input {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            /* 输入框内边距优化 */
            background-color: #fafafa;
        }

        .row input:focus {
            border-color: #8b5cf6;
            /* 更精致的焦点阴影 */
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
            outline: none;
            background-color: #fff;
        }

        /* 输入框placeholder样式优化 */
        .row input::placeholder {
            color: #a0aec0;
            font-size: 15px;
        }

        #submit {
            width: 100%;
            padding: 14px;
            /* 按钮渐变背景 */
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            /* 按钮轻微立体效果 */
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
            position: relative;
            overflow: hidden;
        }

        /* 按钮点击波纹效果 */
        #submit::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s ease, height 0.6s ease;
        }

        #submit:active::after {
            width: 300px;
            height: 300px;
            opacity: 0;
        }

        #submit:hover {
            /* 渐变色彩偏移 */
            background: linear-gradient(90deg, #5b5fe0, #7c4dff);
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(99, 102, 241, 0.4);
        }

        #submit:active {
            transform: translateY(0);
            box-shadow: 0 3px 8px rgba(99, 102, 241, 0.3);
        }

        .login-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            font-size: 14px;
            color: #718096;
        }

        .remember-me {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .remember-me input {
            margin-right: 8px;
            /* 自定义复选框样式 */
            appearance: none;
            width: 16px;
            height: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 4px;
            transition: all 0.2s ease;
            position: relative;
        }

        .remember-me input:checked {
            background-color: #6366f1;
            border-color: #6366f1;
        }

        .remember-me input:checked::after {
            content: '✓';
            position: absolute;
            color: white;
            font-size: 12px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .forgot-password {
            color: #8b5cf6;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .forgot-password:hover {
            text-decoration: underline;
            color: #6366f1;
        }

        .register-link {
            text-align: center;
            margin-top: 28px;
            font-size: 14px;
            color: #718096;
        }

        .register-link a {
            color: #8b5cf6;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .register-link a:hover {
            text-decoration: underline;
            color: #6366f1;
        }

        .error-message {
            color: #ef4444;
            font-size: 14px;
            margin-top: 6px;
            display: none;
            /* 错误提示轻微动画 */
            transition: all 0.2s ease;
        }

        .demo-accounts {
            margin-top: 28px;
            padding: 18px;
            background-color: #f8fafc;
            border-radius: 10px;
            border-left: 4px solid #8b5cf6;
            /* 轻微阴影 */
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .demo-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #2d3748;
        }

        .demo-account {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 13px;
            color: #4a5568;
        }

        .demo-account:last-child {
            margin-bottom: 0;
        }

        .copy-btn {
            background: none;
            border: none;
            color: #8b5cf6;
            cursor: pointer;
            font-size: 12px;
            padding: 2px 6px;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .copy-btn:hover {
            text-decoration: underline;
            background-color: rgba(139, 92, 246, 0.1);
        }

        .social-login {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
        }

        .social-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .social-btn:hover {
            background-color: #f0f4ff;
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.15);
        }

        .social-btn i {
            font-size: 20px;
            transition: all 0.3s ease;
        }

        .social-btn:hover i {
            transform: scale(1.1);
        }

        .google {
            color: #DB4437;
        }

        .github {
            color: #333;
        }

        .wechat {
            color: #09BB07;
        }

        /* 响应式设计优化 */
        @media (max-width: 480px) {
            .login-dialog {
                padding: 35px 25px;
                border-radius: 12px;
            }

            .nav {
                padding: 12px 20px;
            }

            .nav-span {
                margin-left: 15px;
                font-size: 14px;
                padding: 6px 10px;
            }

            .login-dialog h3 {
                font-size: 24px;
            }

            .row input {
                padding: 12px 15px;
            }

            #submit {
                padding: 12px;
            }

            .social-btn {
                width: 40px;
                height: 40px;
            }
        }
    </style>

    <!-- 引入Font Awesome图标 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="nav">
        <img src="pic/logo2.jpg" alt="">
        <span class="blog-title">我的博客</span>
        <div class="space"></div>
        <a class="nav-span" href="blog_list.html">主页</a>
        <a class="nav-span" href="blog_edit.html">写博客</a>
    </div>

    <div class="container-login">
        <div class="login-dialog">
            <h3>登陆</h3>
            <div class="row">
                <span>用户名</span>
                <input type="text" name="username" id="username" placeholder="请输入用户名">
                <div class="error-message" id="usernameError"></div>
            </div>
            <div class="row">
                <span>密码</span>
                <input type="password" name="password" id="password" placeholder="请输入密码">
                <div class="error-message" id="passwordError"></div>
            </div>

            <div class="login-options">
                <div class="remember-me">
                    <input type="checkbox" id="remember">
                    <label for="remember">记住我</label>
                </div>
                <a href="forgot_password.html" class="forgot-password">忘记密码?</a>
            </div>

            <div class="row">
                <button id="submit">提交</button>
            </div>

            <div class="register-link">
                还没有账户? <a href="blog_register.html">立即注册</a>
            </div>

            <div class="demo-accounts">
                <div class="demo-title">演示账户 (点击复制)</div>
                <div class="demo-account">
                    <span>管理员: admin / admin123</span>
                    <button class="copy-btn" data-username="admin" data-password="admin123">复制</button>
                </div>
                <div class="demo-account">
                    <span>普通用户: user / user123</span>
                    <button class="copy-btn" data-username="user" data-password="user123">复制</button>
                </div>
            </div>

            <div class="social-login">
                <button class="social-btn google">
                    <i class="fab fa-google"></i>
                </button>
                <button class="social-btn github">
                    <i class="fab fa-github"></i>
                </button>
                <button class="social-btn wechat">
                    <i class="fab fa-weixin"></i>
                </button>
            </div>
        </div>
    </div>

    <script src="js/jquery.min.js"></script>
    <script>
        // 登录功能
        function login() {
            // 获取输入值
            const username = $('#username').val().trim();
            const password = $('#password').val();
            const remember = $('#remember').is(':checked');

            // 清除之前的错误信息
            $('.error-message').hide();

            // 表单验证
            let isValid = true;

            if (!username) {
                $('#usernameError').text('请输入用户名').show();
                isValid = false;
            }

            if (!password) {
                $('#passwordError').text('请输入密码').show();
                isValid = false;
            } else if (password.length < 4) {
                $('#passwordError').text('密码长度至少4位').show();
                isValid = false;
            }

            if (!isValid) {
                return;
            }

            // 显示加载状态
            $('#submit').html('<i class="fas fa-spinner fa-spin"></i> 登录中...').prop('disabled', true);


            // 模拟AJAX请求
            // 发送AJAX请求到后端接口
            $.ajax({
                url: '/user/login', // 后端登录接口地址
                type: 'POST',
                //contentType: 'application/json',
                data: {
                    username: username,
                    password: password,
                },
                //dataType: 'json',
                timeout: 10000, // 10秒超时

                success: function (result) {
                    // 请求成功，处理返回结果
                    if (result.code == 200) {

                        //console.log(result.data);
                        
                        // 登录成功
                        localStorage.setItem("user_token", result.data);

                        // 保存登录状态
                        if (remember) {
                            localStorage.setItem('rememberMe', 'true');
                            localStorage.setItem('username', username);
                        }

                        // 显示成功消息
                        alert('登录成功！');

                        // 跳转到博客列表页
                        window.location.href = "blog_list.html";
                    } else {
                        // 登录失败
                        handleLoginError(result);
                    }
                },

                error: function (xhr, status, error) {
                    // 请求失败处理
                    handleRequestError(xhr, status, error);
                },

                complete: function () {
                    // 无论成功失败，都恢复按钮状态
                    $('#submit').html('提交').prop('disabled', false);
                }
            });
        }

        // 登录失败处理（补充原有缺失的函数）
        function handleLoginError(result) {
            if (result.errMsg) {
                // 优先显示后端返回的错误
                if (result.errMsg.includes('用户名')) {
                    $('#usernameError').text(result.errMsg).show();
                } else if (result.errMsg.includes('密码')) {
                    $('#passwordError').text(result.errMsg).show();
                } else {
                    // 通用错误显示在第一个输入框
                    $('#usernameError').text(result.errMsg).show();
                }
            } else {
                $('#passwordError').text('用户名或密码错误').show();
            }
        }

        // 请求失败处理（补充原有缺失的函数）
        function handleRequestError(xhr, status, error) {
            if (status === 'timeout') {
                $('#usernameError').text('请求超时，请检查网络').show();
            } else if (xhr.status === 404) {
                $('#usernameError').text('登录接口不存在').show();
            } else {
                $('#usernameError').text('登录失败，请稍后重试').show();
            }
        }

        // 绑定登录按钮点击事件
        $(document).ready(function () {
            $('#submit').click(login);

            // 回车键登录
            $('#username, #password').keypress(function (e) {
                if (e.which === 13) {
                    login();
                }
            });

            // 演示账户复制功能
            $('.copy-btn').click(function () {
                const username = $(this).data('username');
                const password = $(this).data('password');

                $('#username').val(username);
                $('#password').val(password);

                // 清除错误信息
                $('.error-message').hide();

                // 显示提示
                alert(`已填充 ${username} 的登录信息`);
            });

            // 社交登录按钮事件
            $('.social-btn').click(function () {
                const platform = $(this).hasClass('google') ? 'Google' :
                    $(this).hasClass('github') ? 'GitHub' : '微信';
                alert(`${platform} 登录功能正在开发中`);
            });

            // 检查是否有保存的用户名
            if (localStorage.getItem('rememberMe') === 'true') {
                const savedUsername = localStorage.getItem('username');
                if (savedUsername) {
                    $('#username').val(savedUsername);
                    $('#remember').prop('checked', true);
                }
            }
        });
    </script>
</body>

</html>
